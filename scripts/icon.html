<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!-- ASTER icon: warm gradient, deep-ink 8-point sparkle -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c0"/>
      <stop offset="0.55" stop-color="#f7b7cf"/>
      <stop offset="1" stop-color="#c8b6f8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="#3a3126" transform="translate(256 256)">
    <!-- four long rays -->
    <path d="M0 -158 L26 -26 L158 0 L26 26 L0 158 L-26 26 L-158 0 L-26 -26 Z"/>
    <!-- four short diagonal rays -->
    <path transform="rotate(45) scale(0.5)" d="M0 -158 L26 -26 L158 0 L26 26 L0 158 L-26 26 L-158 0 L-26 -26 Z"/>
    <circle r="22"/>
  </g>
</svg>
</body>
</html>
